[package]
name = "livox-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
binrw = "0.14.0"
crc = "3.2.1"
socket2 = "0.5"

[dev-dependencies]
ctrlc = "3.4.4"

[workspace]
members = ["viz", "import"]

# The viewer is unusable unoptimised; keep the heavy render deps at -O3 even in
# dev builds (mirrors pangolino's own workspace profile).
[profile.dev.package.pango-render]
opt-level = 3
[profile.dev.package.livox-rust]
opt-level = 1
